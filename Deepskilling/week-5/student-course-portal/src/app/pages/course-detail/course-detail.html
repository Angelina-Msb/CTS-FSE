<div style="padding: 2rem;">
  <h2>Course / User Detail View</h2>
  
  <p *ngIf="loading">Loading details...</p>

  <div *ngIf="!loading && courseDetails" style="border: 1px solid #ddd; padding: 1.5rem; border-radius: 6px; max-width: 400px;">
    <h3>{{ courseDetails.name }}</h3>
    <p><strong>ID:</strong> {{ courseDetails.id }}</p>
    <p><strong>Email:</strong> {{ courseDetails.email }}</p>
    <p><strong>Phone:</strong> {{ courseDetails.phone }}</p>
    <p><strong>Website:</strong> {{ courseDetails.website }}</p>
    
    <br>
    <a routerLink="/api-courses" style="color: #007bff; text-decoration: underline;">Back to Directory</a>
  </div>

  <p *ngIf="!loading && !courseDetails" style="color: red;">Course/User not found for ID: {{ courseId }}</p>
</div>
