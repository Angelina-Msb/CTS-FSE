<div class="api-container" style="padding: 2rem;">
  <h2>Fetched Directory (via HttpClient Service)</h2>

  <!-- Loading State -->
  <p *ngIf="loading" style="color: #666; font-style: italic;">Loading data from API...</p>

  <!-- Error State -->
  <p *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</p>

  <!-- Data Display Table -->
  <table *ngIf="!loading && !errorMessage" border="1" cellpadding="8" style="border-collapse: collapse; width: 100%; max-width: 600px;">
    <thead>
      <tr style="background-color: #f2f2f2;">
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>City</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of apiData">
        <td>
          <a [routerLink]="['/course', item.id]" style="color: #007bff; font-weight: bold;">{{ item.id }}</a>
        </td>
        <td>{{ item.name }}</td>
        <td>{{ item.email }}</td>
        <td>{{ item.address?.city }}</td>
      </tr>
    </tbody>
  </table>
</div>
