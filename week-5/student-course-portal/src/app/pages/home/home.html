<!-- 
  Difference between [property] and [(ngModel)]:
  - [property]: One-way binding from component class to DOM. Updates the view when the TypeScript property changes.
  - [(ngModel)]: Two-way binding. Synchronizes view and model simultaneously; UI updates update TypeScript class state and vice-versa.
-->

<div class="home-container">
  <!-- Interpolation -->
  <h1>Welcome to {{ portalName }}</h1>

  <p>Manage your course enrollments, track your grades, and view your academic profile all in one place.</p>

  <!-- Property Binding & Event Binding -->
  <div style="margin: 1rem 0;">
    <button [disabled]="!isPortalActive" (click)="onEnrollClick()">Enroll Now</button>
    <p *ngIf="message" style="color: green;">{{ message }}</p>
  </div>

  <!-- Two-Way Binding -->
  <div style="margin: 1rem 0;">
    <label for="search">Search Courses: </label>
    <input id="search" [(ngModel)]="searchTerm" placeholder="Type course name..." />
    <p>Searching for: {{ searchTerm }}</p>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <h3>Courses Available</h3>
      <p>12</p>
    </div>
    <div class="stat-card">
      <h3>Enrolled</h3>
      <p>3</p>
    </div>
    <div class="stat-card">
      <h3>GPA</h3>
      <p>3.8</p>
    </div>
  </div>
</div>
