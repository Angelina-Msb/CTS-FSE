<div class="form-container" style="padding: 2rem;">
  <h2>Student Enrollment Request</h2>

  <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
    
    <!-- Student Name -->
    <div class="form-group" style="margin-bottom: 1rem;">
      <label for="studentName">Student Name: </label><br>
      <input 
        type="text" 
        id="studentName" 
        name="studentName" 
        ngModel 
        required 
        minlength="3"
        #nameCtrl="ngModel"
        style="padding: 0.5rem; width: 300px;"
      />
      <div *ngIf="nameCtrl.touched && nameCtrl.invalid" style="color: red; font-size: 0.85rem;">
        <small *ngIf="nameCtrl.errors?.['required']">Name is required.</small>
        <small *ngIf="nameCtrl.errors?.['minlength']">Name must be at least 3 characters.</small>
      </div>
    </div>

    <!-- Student Email -->
    <div class="form-group" style="margin-bottom: 1rem;">
      <label for="studentEmail">Student Email: </label><br>
      <input 
        type="email" 
        id="studentEmail" 
        name="studentEmail" 
        ngModel 
        required 
        email
        #emailCtrl="ngModel"
        style="padding: 0.5rem; width: 300px;"
      />
      <div *ngIf="emailCtrl.touched && emailCtrl.invalid" style="color: red; font-size: 0.85rem;">
        <small *ngIf="emailCtrl.errors?.['required']">Email is required.</small>
        <small *ngIf="emailCtrl.errors?.['email']">Please enter a valid email address.</small>
      </div>
    </div>

    <!-- Course ID -->
    <div class="form-group" style="margin-bottom: 1rem;">
      <label for="courseId">Course ID: </label><br>
      <input 
        type="number" 
        id="courseId" 
        name="courseId" 
        ngModel 
        required 
        #courseCtrl="ngModel"
        style="padding: 0.5rem; width: 300px;"
      />
      <div *ngIf="courseCtrl.touched && courseCtrl.invalid" style="color: red; font-size: 0.85rem;">
        <small *ngIf="courseCtrl.errors?.['required']">Course ID is required.</small>
      </div>
    </div>

    <!-- Preferred Semester -->
    <div class="form-group" style="margin-bottom: 1rem;">
      <label for="preferredSemester">Preferred Semester: </label><br>
      <select id="preferredSemester" name="preferredSemester" ngModel="Odd" style="padding: 0.5rem; width: 315px;">
        <option value="Odd">Odd Semester</option>
        <option value="Even">Even Semester</option>
      </select>
    </div>

    <!-- Terms and Conditions Checkbox -->
    <div class="form-group" style="margin-bottom: 1rem;">
      <label>
        <input type="checkbox" name="agreeToTerms" ngModel required #termsCtrl="ngModel" />
        I agree to the terms and conditions
      </label>
      <div *ngIf="termsCtrl.touched && termsCtrl.invalid" style="color: red; font-size: 0.85rem;">
        <small>You must agree before submitting.</small>
      </div>
    </div>

    <!-- Buttons -->
    <button type="submit" [disabled]="enrollForm.invalid" style="padding: 0.5rem 1rem; margin-right: 0.5rem;">Submit</button>
    <button type="button" (click)="enrollForm.resetForm()" style="padding: 0.5rem 1rem;">Reset</button>
  </form>

  <!-- Success Message -->
  <div *ngIf="submitted" style="margin-top: 1.5rem; padding: 1rem; background-color: #d4edda; color: #155724; border-radius: 4px;">
    Enrollment request submitted successfully!
  </div>
</div>
